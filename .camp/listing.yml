name: Commander
summary: Quick navigation for Moodle — a searchable command dialog (PhpStorm-style) listing all navigation items, opened with a keyboard shortcut.
description: |
  Commander is a command dialog inspired by PhpStorm **Action** and `oh-my-zsh`.
  It makes navigation in Moodle faster: press the trigger key (backtick by
  default, configurable) and a searchable list of all navigation items appears.
  Move with the arrow keys, open with Enter, close with ESC.

  ## Features

  - Quick navigation by pressing the backtick key or custom configured key(s)
  - Support for multiple trigger keys (comma-separated keycodes)
  - Fast fuzzy search powered by uFuzzy
  - Full keyboard control: arrow keys to move, Enter to open, ESC to close
  - Available for manager, coursecreator, editingteacher and teacher roles
    (capability `local/commander:display`)
  - Modern ES6+ JavaScript with AMD modules
  - OS dark mode support
labels:
